---
name: pre-commit

on:
  pull_request:
    branches: ['**']
  push:
    branches: [stage, main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
    - name: Prepare for pre-commit
      run: |
        cp default.json5 renovate.json5  # renovate-config-validator hook can only validate files that are called renovate.json5
        git add renovate.json5
    - uses: pre-commit/action@v3.0.0
      with:
        extra_args: --all-files --verbose
