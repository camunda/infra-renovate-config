---
name: Renovate – Datasources (Custom)

on:
  schedule:
    # Run daily at 06:00 UTC
  - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (do not push changes)'
        required: false
        default: false
        type: boolean

jobs:
  datasources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: "datasources"
      cancel-in-progress: false
    permissions:
      contents: write  # to push changes to the repository
      id-token: write  # to verify the deployment originates from an appropriate source
      pages: write  # to deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Scheduled runs resolve to main; dispatch runs test the selected branch.
          ref: ${{ github.ref }}
          # Use a token that can push to main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install dependencies
        working-directory: .github/scripts/datasource-generator-cli
        run: |
          pip install -r requirements.txt

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/infra/ci/common BUILDER_INT_TO_K8S_INTERNAL | GCP_CREDENTIALS;

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          credentials_json: ${{ steps.secrets.outputs.GCP_CREDENTIALS }}

      - name: Generate datasources
        working-directory: .github/scripts/datasource-generator-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GKE_DATASOURCE_GCP_PROJECT: camunda-internal
          GKE_DATASOURCE_GCP_LOCATION: europe-west1
        run: |
          python main.py --all --output-dir "$GITHUB_WORKSPACE/datasources" \
            --stale-report "$RUNNER_TEMP/stale-datasources.json"

      - name: Validate generated datasources
        working-directory: .github/scripts/datasource-generator-cli
        run: |
          python -m pytest tests/test_datasource_schema.py::TestGeneratedDatasourceFiles -v \
            --datasources-dir "$GITHUB_WORKSPACE/datasources"

      - name: Check for changes
        id: changes
        run: |
          # Stage all datasource files (new and modified)
          git add datasources/

          # Check if there are any staged changes
          if git diff --cached --quiet datasources/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in datasources"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in datasources:"
            git diff --cached --stat datasources/
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true' && inputs.dry-run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datasources/
          git commit -m "chore: update datasources [skip ci]"
          git push

      - name: Setup Pages
        if: inputs.dry-run != true
        uses: actions/configure-pages@v6

      - name: Create public directory with only datasources
        if: inputs.dry-run != true
        run: |
          mkdir -p _site/datasources
          cp datasources/*.json _site/datasources/

      - name: Upload artifact
        if: inputs.dry-run != true
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: inputs.dry-run != true
        id: deployment
        uses: actions/deploy-pages@v5

      # Runs last so fresh datasources are still committed and published.
      - name: Check datasource freshness
        env:
          STALE_REPORT: ${{ runner.temp }}/stale-datasources.json
        run: |
          count=$(jq -r '.stale | length' "$STALE_REPORT")

          if [[ "$count" -eq 0 ]]; then
            echo "Every checked datasource published a release within its threshold."
            exit 0
          fi

          echo "$count datasource(s) are stale:"
          jq -r '.stale[] | "  - \(.name): \(.detail)"' "$STALE_REPORT"

          {
            echo "### Stale datasources"
            echo
            echo "No recent release for:"
            echo
            jq -r '.stale[] | "- `\(.name)`: \(.detail)"' "$STALE_REPORT"
            echo
            echo "New releases may be silently missing."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

  notify-on-failure:
    if: failure() && inputs.dry-run != true
    needs:
    - datasources
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Import Secrets
      id: secrets
      uses: hashicorp/vault-action@v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: approle
        roleId: ${{ secrets.VAULT_ROLE_ID }}
        secretId: ${{ secrets.VAULT_SECRET_ID }}
        exportEnv: false
        secrets: |
          secret/data/products/infra/ci/infra-core SLACK_WEBHOOK_INFRA_ALERTS;
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        text: ":no_entry: Datasource update workflow failed in infra-renovate-config"
        status: failure
        channel: '#infra-alerts'
        fields: repo,action,eventName,ref,workflowRun,job
      env:
        SLACK_WEBHOOK_URL: ${{ steps.secrets.outputs.SLACK_WEBHOOK_INFRA_ALERTS }}
